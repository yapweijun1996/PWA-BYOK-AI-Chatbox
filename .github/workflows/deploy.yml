name: Build and deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run tests
        run: npm test
      - name: Check module dependencies
        run: npm run test:architecture
      - name: Verify design tokens
        run: |
          npx --yes --package style-dictionary@5.5.3 style-dictionary build --config tokens/light.config.json
          npx --yes --package style-dictionary@5.5.3 style-dictionary build --config tokens/dark.config.json
          npm run colors
          git diff --exit-code -- src/generated
      - name: Build app
        run: npm run build
      - name: Run browser regression tests
        run: npm run test:browser
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
